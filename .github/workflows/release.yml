name: Release Package

# 发布 Release（或手动指定标签）时，把整份 Rime 配置打包成 zip 上传到该 Release。
# 包内解压后是一个 <仓库名>-<tag>/ 目录，把里面的文件复制到 Rime 用户目录即可使用；
# Xime（曦码）用户也可以直接把 zip 当「方案包」导入（导入器会自动剥掉这一层目录）。
# GitHub 会为上传递增资源展示 SHA-256，同时额外生成 .sha256 文件方便命令行校验。
on:
  release:
    types: [published]
  # 支持手动补传：Release 已存在但资源上传失败、或需要重新打包时用
  workflow_dispatch:
    inputs:
      tag:
        description: '要打包并上传的 Release 标签，例如 v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-package-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          fetch-depth: 0

      - name: 打包配置并生成 SHA-256
        run: |
          set -euo pipefail

          if [ -z "${TAG}" ]; then
            echo "::error::未获取到 Release 标签"
            exit 1
          fi

          # 用仓库名做包名（fork/改名后不用改这里），例如 rime-wbpy-full-v1.0.0
          NAME="$(basename "${GITHUB_REPOSITORY}")-${TAG}"
          mkdir -p dist

          # 复制需要分发的文件：排除版本控制、CI、编辑器、本地部署与构建产物
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.idea/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.DS_Store' \
            --exclude='build/' \
            --exclude='dist/' \
            --exclude='sync/' \
            --exclude='user.yaml' \
            --exclude='installation.yaml' \
            --exclude='*.userdb/' \
            --exclude='*.zip' \
            --exclude='*.sha256' \
            ./ "dist/${NAME}/"

          # 硬性检查：缺了这些文件，打出来的包在 Rime 里根本起不来
          for f in default.yaml default.custom.yaml wubi86.schema.yaml wubi86.dict.yaml pinyin_simp.schema.yaml pinyin_simp.dict.yaml; do
            if [ ! -f "dist/${NAME}/${f}" ]; then
              echo "::error::打包缺文件：${f}"
              exit 1
            fi
          done

          echo "文件数：$(find "dist/${NAME}" -type f | wc -l)"

          # 压缩包解压后得到 ${NAME}/ 目录，内容可直接复制到 Rime 用户目录
          (cd dist && zip -rq "${NAME}.zip" "${NAME}")
          (cd dist && sha256sum "${NAME}.zip" > "${NAME}.zip.sha256")

          echo "包内前几项："
          unzip -l "dist/${NAME}.zip" | head -8
          echo "打包完成："
          ls -lh dist
          cat "dist/${NAME}.zip.sha256"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
