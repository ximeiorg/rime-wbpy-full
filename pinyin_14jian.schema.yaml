# Rime schema
# encoding: utf-8
#
# 拼音 14 键（与 pinyin_simp 共享词典，独立 prism）
#
# 合并键布局（对应 Xime 的 keyboard.qwerty_14）：
#   qw / er / ty / ui / op
#   as / df / gh / jk / l
#   zx / cv / bn / m
# 前端每个合并键只上送组内第一个字母（代表字母），所以输入侧可用字母只有
# q e t u o a d g j l z c b m 这 14 个。
#
# 消歧不靠引擎特判，而是靠拼写运算把词库里的拼音码折成「按键序列码」：
#   derive/(.*)/\U$1/            先复制一份大写码（小写原码保留）
#   xlit/大写字母/代表字母/        再把大写副本逐位折成代表字母
# 例：ni → NI → BI → bu；bi → bu。两个音节在按键序列上重合，
# 由 pinyin_simp 的词频在候选层消歧。
#
# 反查用 ` 前缀打五笔码（本仓库没有笔画词库，故以 wubi86 作反查字典）。

schema:
  schema_id: pinyin_14jian
  name: 拼音14键
  version: "1.0"
  author:
    - 曦码（Xime）
  description: |
    拼音 14 键：横向相邻两字母合并成一键（qw/er/ty/ui/op、as/df/gh/jk/l、zx/cv/bn/m），
    键宽大、误触少；合并带来的歧义由词库词频消歧。
  dependencies:
    - pinyin_simp

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - reverse_lookup_translator
    - lua_translator@*uuid

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # ── 与 pinyin_simp 一致的简拼 / 容错规则 ──
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
    # ── 合并键：拼音码 → 按键序列码 ──
    # 目标串按 QWERTY 顺序逐位给出 26 个字母的代表字母，与 qwerty_14 的分组一一对应：
    #   QW→q ER→e TY→t UI→u OP→o / AS→a DF→d GH→g JK→j L→l / ZX→z CV→c BN→b M→m
    - derive/(.*)/\U$1/
    - xlit/QWERTYUIOPASDFGHJKLZXCVBNM/qqeettuuooaaddggjjlzzccbbm/

translator:
  dictionary: pinyin_simp
  prism: pinyin_14jian
  packs:
    - user_simp
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

reverse_lookup:
  dictionary: wubi86
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔五笔〕

menu:
  page_size: 5

punctuator:
  import_preset: default
  __include: symbols:/punctuator

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]+[a-z]*|[a-z]+)$"
    reverse_lookup: "^`[a-z]*'?$"
